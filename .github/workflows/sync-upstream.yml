name: Sync upstream Palpo main

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [patched]
    paths:
      - .github/workflows/sync-upstream.yml
      - .github/scripts/sync_upstream.sh
      - .github/scripts/test_sync_upstream.py

concurrency:
  group: sync-upstream-palpo
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify upstream sync safety
        run: python3 -m unittest discover -s .github/scripts -p test_sync_upstream.py

      - name: Check upstream main and merge into the custom fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/sync_upstream.sh
